<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neo · MetaHuman — embed</title>
<!--
  digitalavatar.ai · EMBED del MetaHuman (Neo/Keanu, Pixel Streaming).
  Página autocontenida pensada para ir DENTRO de un <iframe> en cualquier web.
  Patrón "facade": arranca con un póster ligero y solo carga el stream al pulsar
  (no machaca el host de render en cada carga de la web anfitriona).
  Parámetros de URL:
    ?ask=1        muestra la caja de preguntas (habla con Neo). Por defecto: solo ver.
    ?autostart=1  salta el póster y carga el stream de una.
  El sondeo de vida va por <img> cross-origin (fiable) y cae al avatar web si el host está apagado.
-->
<style>
  :root{ --bg:#05080f; --panel:rgba(10,19,30,.72); --line:#1b3346; --txt:#eaf6ff; --muted:#86a6bd; --accent:#5fd0ff; --ok:#6ce6a2; }
  *{box-sizing:border-box}
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
  html,body{ margin:0; height:100%; background:transparent; color:var(--txt); font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif }
  .wrap{ display:flex; flex-direction:column; height:100%; min-height:0; gap:8px }
  .stage{ position:relative; flex:1 1 auto; min-height:0; background:#000; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,.5) }
  .da-neo-fit{ position:relative }
  #mh{ position:absolute; inset:0; display:block; width:100%; height:100%; border:0; background:#000 }
  .vstate{ min-height:1em; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted) }
  .vstate[data-s="escuchando"]{ color:#ff9bb8 }
  .vstate[data-s="pensando"],.vstate[data-s="activando"]{ color:var(--accent) }
  .vstate[data-s="hablando"]{ color:var(--ok) }
  .vstate[data-s="error"],.vstate[data-s="cortada"]{ color:#ff8a7a }
  .bar{ position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center; gap:8px; padding:8px 12px;
    font-size:.72rem; color:var(--muted); background:linear-gradient(180deg, rgba(5,8,15,.82), rgba(5,8,15,0)); pointer-events:none }
  .live{ display:inline-flex; align-items:center; gap:6px; color:var(--ok); font-weight:700; letter-spacing:.04em }
  .live .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 10px var(--ok); animation:p 1.3s infinite }
  @keyframes p{ 50%{opacity:.3} }
  /* Póster (facade) — se sustituye por el stream al pulsar */
  /* Póster real de Neo: <img> + velo, en vez de background-image (más fiable de encuadrar). */
  .facade{ position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px; cursor:pointer;
    text-align:center; padding:20px 20px 26px; background:#05080f; overflow:hidden }
  .facade picture{ display:contents }   /* que el <img> se posicione contra .facade, no contra el <picture> */
  .facade .poster{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center center; z-index:0; display:block }
  .facade .veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(to bottom, rgba(5,8,15,.28) 0%, rgba(5,8,15,.12) 40%, rgba(5,8,15,.84) 74%, rgba(5,8,15,.97) 100%) }
  .facade .code{ position:absolute; inset:0; opacity:.07; overflow:hidden; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#2ee6a6; font-size:12px; line-height:1.15; letter-spacing:2px; white-space:pre; pointer-events:none }
  .facade .play{ width:66px; height:66px; border-radius:50%; border:1px solid #2a7fa6; background:linear-gradient(180deg,#0e3550cc,#0a2335cc); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:1.5rem; box-shadow:0 0 30px rgba(95,208,255,.25) }
  .facade h2{ margin:0; font-size:1.05rem } .facade h2 b{ color:var(--accent) }
  .facade p{ margin:0; color:var(--muted); font-size:.8rem; max-width:280px; line-height:1.5 }
  .facade .z{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:12px }
  /* Caja de preguntas (opcional) */
  .ask{ flex:0 0 auto; display:none; flex-direction:column; gap:7px }
  .ask.on{ display:flex }
  .askrow{ display:flex; gap:6px; flex-wrap:wrap }
  .ask input{ flex:1 1 140px; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:10px 12px; color:var(--txt); font-size:.9rem; outline:none }
  .ask input:focus{ border-color:var(--accent) }
  .ask button{ border:1px solid #2a7fa6; background:linear-gradient(180deg,#0e3550,#0a2335); color:var(--accent); font-weight:700; border-radius:11px; padding:0 13px; font-size:.9rem; cursor:pointer }
  .ask button:disabled{ opacity:.5; cursor:progress }
  .ask #mic.rec{ border-color:#ff6b6b; color:#ff6b6b }
  .ans{ color:var(--muted); font-size:.82rem; line-height:1.45; white-space:pre-wrap }
  .ans.show{ color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:9px 12px }
  .cred{ position:absolute; bottom:6px; right:10px; z-index:3; font-size:.62rem; color:var(--muted); opacity:.7; text-decoration:none }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage da-neo-fit" id="mhFit">
      <div class="bar"><span class="live"><span class="dot"></span>EN VIVO</span> · MetaHuman · Pixel Streaming</div>
      <div class="facade" id="facade">
        <picture>
          <source media="(min-aspect-ratio: 5/4)" srcset="assets/neo-poster-16x9.jpg">
          <source media="(min-aspect-ratio: 4/5)" srcset="assets/neo-poster-1x1.jpg">
          <img class="poster" src="assets/neo-poster.jpg" alt="Neo, humano digital MetaHuman" loading="eager" decoding="async">
        </picture>
        <div class="veil" aria-hidden="true"></div>
        <div class="code" id="code" aria-hidden="true"></div>
        <div class="z">
          <div class="play">▶</div>
          <h2>Habla con <b>Neo</b></h2>
          <p>Humano digital MetaHuman en Unreal Engine 5, en vivo. Pulsa para conectar.</p>
        </div>
      </div>
      <a class="cred" href="https://digitalavatar.ai/metahuman.html" target="_blank" rel="noopener">digitalavatar.ai ↗</a>
    </div>
    <div class="ask" id="ask">
      <div class="vstate" id="vstate" data-s="listo">Listo</div>
      <div class="askrow">
        <input id="q" type="text" placeholder="Pregúntale a Neo…" autocomplete="off">
        <button id="mic" title="Hablar" aria-label="Hablar por micrófono">🎤</button>
        <button id="cut" type="button">Cortar</button>
        <button id="send">Preguntar</button>
      </div>
      <div id="ans" class="ans"></div>
    </div>
  </div>

<script src="/assets/da-neo-player.js?v=20261004-proxy-1"></script>
<script src="/assets/da-demo-voice.js?v=20261004-audio-3"></script>
<script>
(function(){
  var P=new URLSearchParams(location.search);
  var showAsk = P.get('ask')==='1';
  var autostart = P.get('autostart')==='1';
  // Idioma: ?lang=es|en lo fuerza la web anfitriona; si no, el del visitante.
  var LANG = (P.get('lang')||'').slice(0,2).toLowerCase();
  if(LANG!=='es' && LANG!=='en') LANG = ((navigator.language||'es').slice(0,2)==='es') ? 'es' : 'en';
  var EN = LANG==='en';
  var T = {
    live:      EN ? 'LIVE'          : 'EN VIVO',
    facadeH2:  EN ? 'Talk to <b>Neo</b>' : 'Habla con <b>Neo</b>',
    facadeP:   EN ? 'A MetaHuman digital human in Unreal Engine 5, live. Tap to connect.'
                  : 'Humano digital MetaHuman en Unreal Engine 5, en vivo. Pulsa para conectar.',
    ph:        EN ? 'Ask Neo…'      : 'Pregúntale a Neo…',
    micT:      EN ? 'Speak'         : 'Hablar',
    send:      EN ? 'Ask'           : 'Preguntar',
    cut:       EN ? 'Cut'           : 'Cortar',
    thinking:  EN ? '· thinking…'   : '· respondiendo…',
    noAnswer:  EN ? '(no answer)'   : '(sin respuesta)',
    connErr:   EN ? 'Connection error' : 'Error de conexión',
    listo:     EN ? 'Ready'         : 'Listo',
    escuchando:EN ? 'Listening'     : 'Escuchando',
    pensando:  EN ? 'Thinking'      : 'Pensando',
    hablando:  EN ? 'Speaking'      : 'Hablando',
    activando: EN ? 'Turning voice on' : 'Activando voz',
    cortada:   EN ? 'Voice cut'     : 'Voz cortada',
    micNo:     EN ? 'This browser has no dictation. Type the question.' : 'Este navegador no tiene dictado. Escribe la pregunta.',
    micDenied: EN ? 'Microphone blocked. Allow it, or type.' : 'Micro bloqueado. Permite el micrófono o escribe.',
    micFail:   EN ? 'The microphone failed. Type the question.' : 'No se pudo usar el micrófono. Escribe la pregunta.',
    micEmpty:  EN ? 'Nothing was heard. Try again or type.' : 'No se oyó nada. Prueba otra vez o escribe.',
    audioBlocked: EN ? 'The browser blocked audio. Tap again to hear the reply.' : 'El navegador bloqueó el audio. Pulsa de nuevo para oír la respuesta.',
    noVoice:   EN ? 'No voice: the brain returned no audio.' : 'Sin voz: el cerebro no devolvió audio.',
    modeWeb:   EN ? '● WEB MODE'    : '● MODO WEB',
    offline:   EN ? 'render host offline — voice plays here' : 'host de render offline — la voz suena aquí'
  };
  document.documentElement.lang = LANG;
  var PROBE=DANeoPlayer.probe; // <img> cross-origin: sondeo fiable (no fetch no-cors)
  var stage=document.querySelector('.stage'), facade=document.getElementById('facade'), bar=document.querySelector('.bar');
  var ask=document.getElementById('ask');
  if(showAsk) ask.classList.add('on');

  // Textos estáticos según idioma
  (function(){
    var h2=document.querySelector('.facade h2'), fp=document.querySelector('.facade p');
    if(h2) h2.innerHTML=T.facadeH2;
    if(fp) fp.textContent=T.facadeP;
    bar.innerHTML='<span class="live"><span class="dot"></span>'+T.live+'</span> · MetaHuman · Pixel Streaming';
    var qi=document.getElementById('q'), mi=document.getElementById('mic'), sb=document.getElementById('send');
    if(qi) qi.placeholder=T.ph;
    if(mi){ mi.title=T.micT; mi.setAttribute('aria-label', EN?'Speak into the microphone':'Hablar por micrófono'); }
    if(sb) sb.textContent=T.send;
    var cb=document.getElementById('cut'); if(cb) cb.textContent=T.cut;
    var vs=document.getElementById('vstate'); if(vs) vs.textContent=T.listo;
  })();

  // lluvia Matrix del póster (barata, decorativa)
  (function(){ var el=document.getElementById('code'); if(!el) return;
    var cols=26, rows=40, g='01<>/{}[]=+*·#'; var out='';
    for(var r=0;r<rows;r++){ var line=''; for(var c=0;c<cols;c++){ line+= g[(r*7+c*3)%g.length]+' '; } out+=line+'\n'; }
    el.textContent=out;
  })();

  var iframe=null, mode=null, fails=0, started=false, talkTimer=null, seq=0;
  var vstate=document.getElementById('vstate');
  var SHORT={listo:1,escuchando:1,pensando:1,hablando:1,activando:1,cortada:1};
  function paint(s, text){
    if(!vstate) return;
    vstate.dataset.s=s; vstate.textContent=text||T[s]||s;
    if(SHORT[s] && DADemo.state()!==s) DADemo.setState(s);
  }
  DADemo.onState(function(s){ if(SHORT[s]) paint(s); });
  function reach(){ return new Promise(function(res){
    var done=false, img=new Image();
    var t=setTimeout(function(){ if(!done){done=true; res(false);} }, 9000);
    img.onload =function(){ if(!done){done=true; clearTimeout(t); res(true);} };
    img.onerror=function(){ if(!done){done=true; clearTimeout(t); res(false);} };
    img.src=PROBE+'?_='+Date.now();
  }); }
  function ensureIframe(){ if(iframe) return iframe;
    iframe=document.createElement('iframe'); iframe.id='mh';
    iframe.allow='autoplay; fullscreen; microphone; camera'; iframe.setAttribute('allowfullscreen','');
    iframe.referrerPolicy='no-referrer';
    stage.insertBefore(iframe, bar);
    DANeoPlayer.bindFit(iframe);
    return iframe;
  }
  function toMH(){
    window.__daHostUp=true;
    if(mode==='mh') return;
    var wasWeb=mode==='web';
    mode='mh';
    var fr=ensureIframe();
    fr.dataset.mode='mh';
    var muted=wasWeb ? true : (window.__daStreamUnmuted ? false : window.__daPreferMuted!==false);
    if(wasWeb) window.__daStreamUnmuted=false;
    var want=DANeoPlayer.src({muted:muted});
    if(fr.src!==want) fr.src=want;
    DANeoPlayer.fit(fr);
    if(showAsk) ask.classList.add('on');
    bar.innerHTML='<span class="live"><span class="dot"></span>'+T.live+'</span> · MetaHuman · Pixel Streaming';
  }
  function toWeb(){ if(mode==='web')return; mode='web';
    window.__daHostUp=false; window.__daStreamUnmuted=false;
    var fr=ensureIframe();
    fr.dataset.mode='web';
    DANeoPlayer.fill(fr);
    fr.src=DANeoPlayer.webFallback;
    if(showAsk) ask.classList.add('on');
    bar.innerHTML='<span style="color:#ffb454;font-weight:700">'+T.modeWeb+'</span> · '+T.offline;
  }
  async function tick(){
    if(await reach()){ fails=0; toMH(); }
    else if(++fails>=2){ toWeb(); }
    setTimeout(tick, mode==='web' ? 30000 : (fails===1 ? 4000 : 15000));
  }
  function start(muted){
    if(started) return;
    started=true;
    DADemo.unlock();
    window.__daPreferMuted=!!muted;
    if(!muted) window.__daStreamUnmuted=true;
    if(facade&&facade.parentNode) facade.remove();
    tick();
  }
  if(facade) facade.addEventListener('click', function(){ start(false); }, {once:true});
  if(autostart) start(true);

  function armStream(muted){
    if(!iframe || iframe.dataset.mode==='web' || window.__daHostUp===false) return Promise.resolve();
    var want=DANeoPlayer.src({muted:!!muted});
    window.__daStreamUnmuted=!muted;
    if(iframe.src===want){ DANeoPlayer.fit(iframe); return Promise.resolve(); }
    return new Promise(function(res){
      var done=false;
      function finish(){ if(done) return; done=true; iframe.removeEventListener('load', finish); if(iframe.dataset.mode!=='web') DANeoPlayer.fit(iframe); res(); }
      iframe.addEventListener('load', finish);
      iframe.src=want;
      setTimeout(finish, 4500);
    });
  }

  var API='https://brain.digitalavatar.ai', ROOM='xtanco', history=[];
  var q=document.getElementById('q'), send=document.getElementById('send'), mic=document.getElementById('mic'), ansEl=document.getElementById('ans'), cut=document.getElementById('cut');
  function setAns(t,show){ ansEl.textContent=t; ansEl.classList.toggle('show',!!show); }
  async function doAsk(){
    var text=(q.value||'').trim(); if(!text) return;
    var mine=++seq;
    if(!started) start(false);
    DADemo.unlock(); DADemo.stop(); clearTimeout(talkTimer);
    send.disabled=true; paint('pensando'); setAns(T.thinking,true); q.value='';
    try{
      var host=window.__daHostUp;
      if(host!==true && host!==false) host=await DANeoPlayer.whenHost(12000);
      if(mine!==seq) return;
      var offline=host===false;
      if(!offline && !window.__daStreamUnmuted){
        paint('activando');
        await armStream(false);
        if(mine!==seq) return;
        paint('pensando');
      }
      var qOut = text + (EN
        ? '\n\n(You are Neo, the digital human of digitalavatar.ai. Always answer as Neo. Please answer in English.)'
        : '\n\n(Eres Neo, el humano digital de digitalavatar.ai. Responde siempre como Neo.)');
      var r=await fetch(API+'/metahuman/ask',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({question:qOut, room:ROOM, loc:'', persona:'neo', lang:LANG, history:history, voice:true, timestamps:true, voiceId:DADemo.voiceId(LANG)})});
      var d=await r.json(), a=(d.answer||'').trim();
      if(mine!==seq) return;
      setAns(a||T.noAnswer,true);
      if(a){ history.push({role:'user',content:text},{role:'assistant',content:a}); if(history.length>8) history=history.slice(-8); }
      if(offline && d.audioBase64){
        var audio=DADemo.load(d.audioBase64, d.mime);
        audio.onended=function(){ if(mine===seq) paint('listo'); };
        try{ await DADemo.start(audio); paint('hablando'); }
        catch(err){
          paint('error', T.audioBlocked);
          DADemo.armRetry(function(){ DADemo.start(audio).then(function(){ paint('hablando'); }).catch(function(){ paint('error', T.audioBlocked); }); });
        }
      } else if(!offline && (d.audioBase64||a)){
        DADemo.setState('hablando');
        var ms=d.audioBase64?DANeoPlayer.clipMs(d.audioBase64):Math.min(12000, Math.max(1500, a.length*70));
        talkTimer=setTimeout(function(){ if(mine===seq && vstate && vstate.dataset.s==='hablando') paint('listo'); }, ms);
      } else paint('error', T.noVoice);
    }catch(e){ if(mine===seq){ setAns('⚠️ '+T.connErr,true); paint('error', T.connErr); } }
    finally{ if(mine===seq) send.disabled=false; }
  }
  function doCut(){
    seq++; clearTimeout(talkTimer); DADemo.stop();
    if(window.__daStreamUnmuted) armStream(true);
    paint('cortada'); send.disabled=false;
  }
  function micError(code){
    mic.classList.remove('rec');
    var msg=code==='unsupported'?T.micNo:(code==='not-allowed'||code==='service-not-allowed')?T.micDenied:code==='no-speech'?T.micEmpty:T.micFail;
    paint('error', msg); setAns(msg, true);
  }
  send.onclick=doAsk;
  if(cut) cut.onclick=doCut;
  q.addEventListener('keydown',function(e){ if(e.key==='Enter') doAsk(); });
  mic.onclick=function(){
    if(DADemo.state()==='escuchando'){ DADemo.cancelListen(); mic.classList.remove('rec'); paint('listo'); return; }
    if(!started) start(false);
    clearTimeout(talkTimer);
    var ok=DADemo.listen({
      lang:LANG,
      onPartial:function(t){ q.value=t; paint('escuchando'); },
      onFinal:function(t){ mic.classList.remove('rec'); q.value=t; doAsk(); },
      onError:micError,
      onEnd:function(){ mic.classList.remove('rec'); }
    });
    if(ok){ mic.classList.add('rec'); paint('escuchando'); }
  };
})();
</script>
</body>
</html>
